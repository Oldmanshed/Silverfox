<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area Risk Review</title>
<style>
  :root {
    color-scheme: light;
    --page: #f6f6f3;
    --surface: #ffffff;
    --surface-2: #f2f1ed;
    --ink: #121212;
    --ink-2: #55534e;
    --muted: #8a8780;
    --grid: #e6e4dd;
    --axis: #c9c6bc;
    --border: rgba(18, 18, 18, 0.08);
    --brand: #23215c;
    --brand-text: #23215c;
    --brand-ink: #ffffff;
    --brand-soft: #ecebf6;
    --accent: #2a78d6;
    --good-text: #006300;
    --bad-text: #b42f2f;
    --warn-bg: #fff4d6;
    --warn-ink: #3d2e00;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #8f8d86; --grid: #2c2c2a; --axis: #3d3d3a;
      --border: rgba(255, 255, 255, 0.09);
      --brand: #3a37a0; --brand-text: #b3b0ff; --brand-ink: #ffffff; --brand-soft: #23223f;
      --accent: #3987e5; --good-text: #0ca30c; --bad-text: #e66767; --warn-bg: #3a2f12; --warn-ink: #f5dfa6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #8f8d86; --grid: #2c2c2a; --axis: #3d3d3a;
    --border: rgba(255, 255, 255, 0.09);
    --brand: #3a37a0; --brand-text: #b3b0ff; --brand-ink: #ffffff; --brand-soft: #23223f;
    --accent: #3987e5; --good-text: #0ca30c; --bad-text: #e66767; --warn-bg: #3a2f12; --warn-ink: #f5dfa6;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 16px 56px; }
  button, select, input { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }

  /* header */
  .eyebrow { color: var(--brand-text); font-weight: 650; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
  h1 { font-size: 32px; line-height: 1.15; margin: 6px 0 4px; font-weight: 700; letter-spacing: -0.015em; }
  .sub { color: var(--ink-2); font-size: 14px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; margin-left: 6px; vertical-align: 1px; }
  .pill.live { background: rgba(12, 163, 12, 0.12); color: var(--good-text); }

  /* toolbar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 22px 0 6px; }
  .toolbar select { min-width: 200px; }
  select, .btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover, select:hover { border-color: var(--axis); }
  .btn.ghost { background: transparent; }
  .toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .copied { font-size: 12px; color: var(--good-text); }
  .more { display: none; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 8px; }
  .more.open { display: flex; }
  .more label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
  .more label.chk { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; padding-bottom: 8px; }

  /* tabs */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--grid); margin: 18px 0 24px; overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand-text); font-weight: 600; }
  .tab .n { color: var(--muted); font-size: 12px; margin-left: 5px; font-variant-numeric: tabular-nums; font-weight: 400; }

  /* blocks */
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .tile .label { color: var(--ink-2); font-size: 13px; }
  .tile .value { font-size: 30px; font-weight: 700; margin-top: 6px; line-height: 1.1; letter-spacing: -0.01em; }
  .tile .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .tile.dark { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .tile.dark .label, .tile.dark .note { color: rgba(255, 255, 255, 0.78); }
  .good { color: var(--good-text); } .bad { color: var(--bad-text); }
  .tile.dark .good, .tile.dark .bad { color: #fff; font-weight: 600; }
  .section { margin-top: 36px; }
  .section h2 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); margin: 0 0 12px; }
  .two { display: grid; gap: 36px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }

  /* quarter strip */
  .quarters { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .q { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .q .qh { background: var(--brand-soft); padding: 8px 14px; font-weight: 650; font-size: 13px; }
  .q .qb { padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 13px; color: var(--ink-2); align-items: baseline; }
  .q .qb b { color: var(--ink); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
  .q .qb .big { font-size: 22px; }

  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }

  /* callouts */
  .callouts-box { border: 1px dashed var(--axis); border-radius: 12px; padding: 12px 18px; background: var(--surface); min-height: 140px; }
  .callouts { list-style: none; margin: 0; padding: 0; }
  .callouts li { padding: 10px 0; border-bottom: 1px solid var(--grid); }
  .callouts li:last-child { border-bottom: 0; }
  .who { color: var(--muted); font-size: 12px; }

  /* tables */
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { font-size: 12px; color: var(--ink-2); font-weight: 600; white-space: nowrap; background: var(--surface-2); border-bottom: 0; }
  th:first-child { border-radius: 8px 0 0 8px; } th:last-child { border-radius: 0 8px 8px 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  th button { all: unset; cursor: pointer; }
  th button:focus-visible { outline: 2px solid var(--accent); }
  th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 9px; }
  th[aria-sort="descending"] button::after { content: " ▼"; font-size: 9px; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover td { background: var(--surface-2); }
  tbody tr.row.open td { background: var(--surface-2); border-bottom-color: transparent; }
  .acct { font-weight: 600; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; background: var(--brand-soft); color: var(--brand-text); margin-left: 6px; vertical-align: 1px; }
  .risk-amt { color: var(--bad-text); font-weight: 600; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
  .latest { min-width: 220px; max-width: 320px; color: var(--ink-2); font-size: 13px; }
  .latest .snip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .table-scroll { overflow-x: auto; }
  .table-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .table-tools input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; width: 260px; max-width: 100%; }
  .count { color: var(--muted); font-size: 13px; }

  /* note history */
  tr.detail td { background: var(--surface-2); padding: 4px 16px 18px; }
  .history { list-style: none; margin: 0; padding: 0; max-width: 900px; }
  .history li { display: grid; grid-template-columns: 160px 1fr; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
  .history li:last-child { border-bottom: 0; }
  .history .wk { font-weight: 600; font-size: 13px; }
  .history .ns { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .detail-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0 4px; }

  .notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 20px; }
  footer details { width: 100%; }
  footer summary { cursor: pointer; }
  .checks { list-style: none; padding: 0; margin: 8px 0 0; }
  .checks li { padding: 3px 0; }
  .conn-test { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--ink-2); font-size: 13px; }
  .conn-test summary { font-weight: 600; color: var(--ink); }
  table.conn { margin-top: 8px; }
  table.conn th, table.conn td { background: none; border-bottom: 1px solid var(--grid); padding: 6px 8px; font-size: 13px; text-align: left; word-break: break-all; white-space: normal; }
  table.conn th { width: 190px; color: var(--ink-2); border-radius: 0; }

  .tip { position: absolute; pointer-events: none; z-index: 10; display: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,.14); border-radius: 8px; padding: 8px 10px; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tip b { display: block; margin-bottom: 2px; }
  .tip .row { display: flex; gap: 14px; justify-content: space-between; }
  .tip .k { color: var(--ink-2); }
  .noscript { background: #fff4d6; color: #3d2e00; border: 1px solid #e8c56a; border-radius: 10px; padding: 12px 16px; margin: 16px 0; }

  @media (max-width: 600px) {
    h1 { font-size: 26px; }
    .toolbar select { min-width: 0; flex: 1 1 140px; }
    .toolbar .right { margin-left: 0; }
    .history li { grid-template-columns: 1fr; }
  }
  @media print {
    body { background: #fff; }
    .toolbar, .more, .table-tools input, .tabs, footer details { display: none !important; }
    .tile, .q { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Area risk review</div>
    <h1 id="title">Overview</h1>
    <div class="sub"><span id="subtitle"></span><span id="flags"></span></div>
  </header>

  <noscript><div class="noscript"><strong>Scripts are blocked on this page.</strong> The region and week switches need JavaScript. If you see this inside SharePoint, the HTML page settings are blocking scripts.</div></noscript>

  <div class="toolbar">
    <select id="fScope" aria-label="Region"></select>
    <select id="fSnap" aria-label="Week"></select>
    <button type="button" class="btn ghost" id="btnMore" aria-expanded="false" aria-controls="more">More filters</button>
    <div class="right">
      <span class="copied" id="copied" aria-live="polite"></span>
      <button type="button" class="btn ghost" id="btnLink" title="Copy a link to this exact view">Copy link</button>
      <button type="button" class="btn ghost" id="btnPrint">Print</button>
    </div>
  </div>
  <div class="more" id="more">
    <label>Renewal quarter <select id="fQuarter"></select></label>
    <label>Type <select id="fType"></select></label>
    <label>CS owner <select id="fOwner"></select></label>
    <label class="chk"><input type="checkbox" id="fEsp"> ESP accounts only</label>
    <label class="chk"><input type="checkbox" id="fMin"> <span id="fMinLabel">Baseline ≥ $100K only</span></label>
    <label>Slide rules
      <select id="fMode">
        <option value="exclusive">Each account on one slide</option>
        <option value="overlap">As the current workbook (can repeat)</option>
      </select>
    </label>
    <button type="button" class="btn ghost" id="btnReset">Clear filters</button>
  </div>

  <nav class="tabs" role="tablist" id="tabs" aria-label="Slides"></nav>
  <main id="view"></main>

  <footer>
    <span id="footSource"></span>
    <span id="footGen"></span>
    <span id="footNotes"></span>
    <details><summary id="checksSummary">Data checks</summary><ul class="checks" id="checks"></ul></details>
    <details class="conn-test" open><summary>SharePoint connection test</summary>
      <table class="conn"><tbody id="conn"></tbody></table>
    </details>
  </footer>
</div>
<div class="tip" id="tip" role="status"></div>

<script type="application/json" id="risk-data">__RISK_DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("risk-data").textContent);
  var META = DATA.meta || {};
  var RULES = Object.assign({ consumptionThreshold: 0.5, blankConsumptionIsZero: true, minBaselineForRollup: 100000 }, META.rules || {});
  var NOTES_CFG = META.notes || {};

  // ---------- slides: one per risk category ----------
  // "exclusive" walks the list in order and stops at the first match, so every
  // account lands on exactly one slide. "overlap" mirrors the workbook's sheets.
  function cons(r) { return r.consumption == null ? (RULES.blankConsumptionIsZero ? 0 : null) : r.consumption; }
  function lowCons(r) { var c = cons(r); return c != null && c < RULES.consumptionThreshold; }
  function hm(r) { return r.risk === "High" || r.risk === "Medium"; }
  var NAMED = { "Product & Technical Risk": 1, "Value Realization Risk": 1, "Competitive Risk": 1 };
  var thr = Math.round(RULES.consumptionThreshold * 100) + "%";
  var CATS = [
    { id: "consumption", label: "Consumption", title: "Consumption risk accounts",
      desc: "Accounts using less than " + thr + " of what they bought" + (RULES.blankConsumptionIsZero ? " (blank counts as 0%)" : ""),
      test: lowCons, overlap: lowCons },
    { id: "technical", label: "Technical", title: "Technical risk accounts", desc: "Risk reason is Product & Technical Risk",
      test: function (r) { return r.riskReason === "Product & Technical Risk"; } },
    { id: "value", label: "Value realisation", title: "Value realisation risk accounts", desc: "Risk reason is Value Realization Risk",
      test: function (r) { return r.riskReason === "Value Realization Risk"; } },
    { id: "competitive", label: "Competitive", title: "Competitive risk accounts", desc: "Risk reason is Competitive Risk. Each should be flagged with Sales",
      test: function (r) { return r.riskReason === "Competitive Risk"; } },
    { id: "other", label: "Other risk", title: "Other risk accounts", desc: "Any other account rated High or Medium risk, or with risk $ recorded",
      test: function (r) { return hm(r) || r.riskAmt > 0; },
      overlap: function (r) { return !NAMED[r.riskReason] && hm(r); } },
    { id: "healthy", label: "Healthy", title: "Healthy accounts", desc: "Renewing accounts with no risk flagged",
      test: function () { return true; },
      overlap: function (r) { return r.risk === "Low" && !lowCons(r) && r.riskReason !== "Product & Technical Risk" && r.riskReason !== "Competitive Risk"; } }
  ];
  var CAT = {};
  CATS.forEach(function (c, i) { c.rank = i; c.overlap = c.overlap || c.test; CAT[c.id] = c; });
  function category(r) { for (var i = 0; i < CATS.length; i++) if (CATS[i].test(r)) return CATS[i].id; return "healthy"; }
  var RISK_LEVEL = { High: ["var(--critical)", "✖"], Medium: ["var(--serious)", "▲"], Low: ["var(--good)", "●"] };
  var OUTLOOK = { "Expect to save": ["var(--good)", "●"], "At risk": ["var(--serious)", "▲"], "Likely churn": ["var(--critical)", "✖"] };

  // ---------- indexes ----------
  var snaps = DATA.snapshots.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; });
  var snapIdx = {};
  snaps.forEach(function (s, i) { snapIdx[s.id] = i; });
  var bySnap = {};
  DATA.rows.forEach(function (r) { (bySnap[r.snapshot] = bySnap[r.snapshot] || []).push(r); r._cat = category(r); });
  function uniq(list) { return list.filter(function (v, i, a) { return v != null && a.indexOf(v) === i; }).sort(); }
  var ENTITIES = uniq(DATA.rows.map(function (r) { return r.entity; }));
  var REGIONS = uniq(DATA.rows.map(function (r) { return r.region; }));
  var ENTITY_OF = {};
  DATA.rows.forEach(function (r) { if (r.region && r.entity) ENTITY_OF[r.region] = r.entity; });

  // ---------- formatting ----------
  var cur = META.currency || "USD", mC, mF;
  try {
    mC = new Intl.NumberFormat(undefined, { style: "currency", currency: cur, notation: "compact", maximumSignificantDigits: 3 });
    mF = new Intl.NumberFormat(undefined, { style: "currency", currency: cur, maximumFractionDigits: 0 });
  } catch (e) { mC = mF = { format: function (v) { return Math.round(v).toLocaleString(); } }; }
  var nF = new Intl.NumberFormat();
  var money = function (v) { return mC.format(v || 0); };
  var moneyFull = function (v) { return mF.format(v || 0); };
  var int = function (v) { return nF.format(Math.round(v || 0)); };
  var pct = function (v, d) { return v == null || isNaN(v) ? "—" : (v * 100).toFixed(d || 0) + "%"; };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var el = function (id) { return document.getElementById(id); };
  el("fMinLabel").textContent = "Baseline ≥ " + money(RULES.minBaselineForRollup) + " only";

  // ---------- state, mirrored into the URL hash so a view can be shared ----------
  var DEFAULTS = { view: "overview", scope: "all", snap: snaps[snaps.length - 1].id, quarter: "all", type: "all", owner: "all", esp: false, min: false, mode: "exclusive" };
  var FILTER_KEYS = ["quarter", "type", "owner", "esp", "min", "mode"];
  var state = Object.assign({}, DEFAULTS);
  var BOOL = { esp: 1, min: 1 };
  function readHash() {
    try {
      var p = new URLSearchParams(location.hash.replace(/^#/, ""));
      Object.keys(state).forEach(function (k) { var v = p.get(k); if (v != null) state[k] = BOOL[k] ? v === "1" : v; });
      if (snapIdx[state.snap] == null) state.snap = DEFAULTS.snap;
      if (state.view !== "overview" && !CAT[state.view]) state.view = "overview";
    } catch (e) { /* sandboxed: keep defaults */ }
  }
  function hashString() { return Object.keys(state).map(function (k) { return k + "=" + encodeURIComponent(BOOL[k] ? (state[k] ? "1" : "0") : state[k]); }).join("&"); }
  function writeHash() { try { history.replaceState(null, "", "#" + hashString()); } catch (e) { /* ignore */ } }

  // scope is "all", "entity:<name>" or "region:<name>"
  function scopeParts() { var i = state.scope.indexOf(":"); return i < 0 ? ["all", ""] : [state.scope.slice(0, i), state.scope.slice(i + 1)]; }
  function inScope(r) {
    var sp = scopeParts();
    if (sp[0] !== "all" && r[sp[0]] !== sp[1]) return false;
    if (state.quarter !== "all" && r.quarter !== state.quarter) return false;
    if (state.type !== "all" && r.type !== state.type) return false;
    if (state.owner !== "all" && (r.owner || "(no owner)") !== state.owner) return false;
    if (state.esp && !r.esp) return false;
    if (state.min && r.baseline < RULES.minBaselineForRollup) return false;
    return true;
  }
  function rowsFor(id) { return (bySnap[id] || []).filter(inScope); }
  function scopeName() { var sp = scopeParts(); return sp[0] === "all" ? "All regions" : sp[1]; }
  function members(rows, c) { return rows.filter(function (r) { return state.mode === "exclusive" ? r._cat === c.id : c.overlap(r); }); }
  function sum(rows, k) { return rows.reduce(function (t, r) { return t + (r[k] || 0); }, 0); }
  function riskRows(rows) { return rows.filter(function (r) { return r._cat !== "healthy"; }); }
  function weekOnly(sn) { return sn ? String(sn.label || sn.id).split(" · ")[0] : ""; }

  // ---------- manager notes and callouts (SharePoint lists) ----------
  var notes = { list: DATA.sampleNotes || [], callouts: DATA.sampleCallouts || [], status: DATA.sampleNotes ? "sample" : "none", detail: "" };
  var noteIdx = {};
  function indexNotes() {
    noteIdx = {};
    notes.list.forEach(function (n) {
      [n.accountId, n.account && "name:" + String(n.account).toLowerCase()].forEach(function (k) { if (k) (noteIdx[k] = noteIdx[k] || []).push(n); });
    });
    Object.keys(noteIdx).forEach(function (k) { noteIdx[k].sort(function (a, b) { return a.created < b.created ? 1 : -1; }); });
  }
  // Notes written before the next snapshot belong to the selected week, so going back in time hides later notes.
  function cutoff() { var n = snaps[snapIdx[state.snap] + 1]; return n ? n.id : "9999"; }
  function notesFor(r) {
    var list = (r.accountId && noteIdx[r.accountId]) || noteIdx["name:" + String(r.account).toLowerCase()] || [];
    var c = cutoff();
    return list.filter(function (n) { return n.created < c; });
  }
  // What the page can see of where it is running. Shown in the connection test box.
  var SITE_RE = /^(https:\/\/[^/]+\.sharepoint\.com(?:\/(?:sites|teams)\/[^/?#]+)?)/i;
  var diag = { address: "", inFrame: "", referrer: "", context: "", site: "", via: "", result: "Not tried yet" };
  function safe(f) { try { return f(); } catch (e) { return "(hidden: " + e.name + ")"; } }
  function webUrl() {

    if (!total) body = '<tr><td colspan="' + COLS.length + '" class="empty">No accounts on this slide</td></tr>';
    if (total > list.length) body += '<tr><td colspan="' + COLS.length + '" style="text-align:center;border:0;padding-top:14px"><button type="button" class="btn" id="showAll">Show all ' + int(total) + " accounts</button></td></tr>";
    else if (showAll && total > TOP_N) body += '<tr><td colspan="' + COLS.length + '" style="text-align:center;border:0;padding-top:14px"><button type="button" class="btn" id="showAll">Show top ' + TOP_N + " only</button></td></tr>";
    el("slideTable").innerHTML = head + "<tbody>" + body + "</tbody>";
    el("slideCount").textContent = (total > list.length ? "Top " + list.length + " of " + int(total) : int(total)) + " accounts by " +
      COLS.filter(function (c) { return c.k === sort.k; })[0].l.toLowerCase() + ". Click an account to see and add notes.";
  }
  function historyHtml(r) {
    var url = listFormUrl(NOTES_CFG.list);
    var head = '<div class="detail-head"><strong>Notes for ' + esc(r.account) + "</strong>" +
      (url ? '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Add note</a>' : '<span class="count">Notes are added in the "' + esc(NOTES_CFG.list || "Account Risk Notes") + '" SharePoint list</span>') + "</div>";
    if (!r.notes.length) return head + '<div class="count">No notes yet for this account.</div>';
    return head + '<ul class="history">' + r.notes.map(function (n) {
      return '<li><div><div class="wk">' + esc(n.week || n.created) + '</div><div class="who">' + esc(n.author || "") + '</div><div style="margin-top:4px">' + badge(OUTLOOK, n.outlook) + "</div></div>" +
        "<div>" + esc(n.analysis || "") + (n.nextStep ? '<div class="ns"><strong>Next step:</strong> ' + esc(n.nextStep) + "</div>" : "") + "</div></li>";
    }).join("") + "</ul>";
  }
  function onTableClick(e) {
    if (e.target.id === "showAll") { showAll = !showAll; renderSlideTable(); return; }
    if (e.target.closest("a")) return;
    var b = e.target.closest("button[data-k]");
    if (b) {
      var k = b.getAttribute("data-k"), num = (COLS.filter(function (c) { return c.k === k; })[0] || {}).num;
      sort = sort.k === k ? { k: k, dir: -sort.dir } : { k: k, dir: num ? -1 : 1 };
      renderSlideTable(); return;
    }
    var tr = e.target.closest("tr.row");
    if (tr) { var key = tr.getAttribute("data-key"); openRow = openRow === key ? null : key; renderSlideTable(); }
  }
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("tr.row")) { e.preventDefault(); e.target.click(); }
  });

  // ---------- footer: notes status + data checks ----------
  function renderFooterNotes() {
    var box = el("conn");
    if (box) box.innerHTML = [["Result", diag.result], ["Site found", diag.site + (diag.via ? " (from " + diag.via + ")" : "")], ["Page address", diag.address],
      ["Inside a frame", diag.inFrame], ["Referring page", diag.referrer], ["SharePoint page context", diag.context]]
      .map(function (r) { return "<tr><th>" + esc(r[0]) + "</th><td>" + esc(r[1]) + "</td></tr>"; }).join("");
    el("footNotes").textContent = "Notes: " + ({ live: "live from SharePoint", sample: "sample notes", none: "none" })[notes.status] + (notes.detail ? " (" + notes.detail + ")" : "");
  }
  function renderChecks(rows) {
    var checks = [
      ["Risk $ recorded but no risk reason", rows.filter(function (r) { return r.riskAmt > 0 && !r.riskReason; })],
      ["Consumption % is blank", rows.filter(function (r) { return r.consumption == null; })],
      ["No risk level (High / Medium / Low)", rows.filter(function (r) { return !r.risk; })],
      ["No CS owner", rows.filter(function (r) { return !r.owner; })]
    ];
    var bad = checks.filter(function (c) { return c[1].length; }).length;
    el("checksSummary").textContent = bad ? "Data checks: " + bad + " issue" + (bad > 1 ? "s" : "") + " in this selection" : "Data checks: all clear";
    el("checks").innerHTML = checks.map(function (c) {
      return "<li>" + (c[1].length ? "▲ " + int(c[1].length) + " · " : "✓ ") + esc(c[0]) +
        (c[1].length ? " (" + esc(c[1].slice(0, 3).map(function (r) { return r.account; }).join(", ")) + (c[1].length > 3 ? "…" : "") + ")" : "") + "</li>";
    }).join("") + (DATA.warnings ? Object.keys(DATA.warnings).map(function (k) { return DATA.warnings[k].map(function (w) { return "<li>Note (" + esc(k) + "): " + esc(w) + "</li>"; }).join(""); }).join("") : "");
  }

  // ---------- main ----------
  function render() {
    var sn = snaps[snapIdx[state.snap]], prevSnap = snaps[snapIdx[state.snap] - 1];
    var rows = rowsFor(state.snap), prev = prevSnap ? rowsFor(prevSnap.id) : [];
    var sp = scopeParts();
    el("eyebrow").textContent = "Area risk review · " + scopeName() + " · " + (sn.week || sn.label || sn.id);
    el("title").textContent = state.view === "overview" ? (sp[0] === "region" ? "Region overview" : sp[0] === "entity" ? sp[1] + " overview" : "Overview") : CAT[state.view].title;
    el("subtitle").textContent = (state.view === "overview" ? "Revenue renewing in the next three quarters, and how much of it is at risk" : CAT[state.view].desc) + " · As of " + (sn.date || sn.id);
    el("flags").innerHTML = (META.note ? '<span class="pill">Sample data</span>' : "") +
      (notes.status === "live" ? '<span class="pill live">Notes live from SharePoint</span>' : notes.status === "sample" ? '<span class="pill">Sample notes</span>' : "");
    el("tabs").innerHTML = '<button type="button" role="tab" class="tab" data-view="overview" aria-selected="' + (state.view === "overview") + '">Overview</button>' +
      CATS.map(function (c) {
        return '<button type="button" role="tab" class="tab" data-view="' + c.id + '" aria-selected="' + (state.view === c.id) + '">' + esc(c.label) + '<span class="n">' + int(members(rows, c).length) + "</span></button>";
      }).join("");
    if (state.view === "overview") renderOverview(rows, prev, prevSnap);
    else renderCategory(rows, prev, prevSnap);
    renderChecks(rows);
    renderFooterNotes();
  }
  function update() { fillToolbar(); writeHash(); render(); }

  document.title = META.title || "Area Risk Review";
  el("footSource").textContent = "Sources: " + (META.sources || []).join(" → ");
  el("footGen").textContent = META.generatedAt ? "Built " + META.generatedAt : "";
  indexNotes();
  readHash();
  update();
  loadLiveNotes();
  window.addEventListener("hashchange", function () { readHash(); update(); });
  var lastW = document.documentElement.clientWidth, timer;
  window.addEventListener("resize", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { var w = document.documentElement.clientWidth; if (w !== lastW) { lastW = w; render(); } }, 150);
  });
})();
</script>
</body>
</html>
