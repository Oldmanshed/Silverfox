<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area Risk Review</title>
<style>
  :root {
    color-scheme: light;
    --page: #f6f6f3;
    --surface: #ffffff;
    --surface-2: #f2f1ed;
    --ink: #121212;
    --ink-2: #55534e;
    --muted: #8a8780;
    --grid: #e6e4dd;
    --axis: #c9c6bc;
    --border: rgba(18, 18, 18, 0.08);
    --brand: #23215c;
    --brand-text: #23215c;
    --brand-ink: #ffffff;
    --brand-soft: #ecebf6;
    --accent: #2a78d6;
    --good-text: #006300;
    --bad-text: #b42f2f;
    --warn-bg: #fff4d6;
    --warn-ink: #3d2e00;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #8f8d86; --grid: #2c2c2a; --axis: #3d3d3a;
      --border: rgba(255, 255, 255, 0.09);
      --brand: #3a37a0; --brand-text: #b3b0ff; --brand-ink: #ffffff; --brand-soft: #23223f;
      --accent: #3987e5; --good-text: #0ca30c; --bad-text: #e66767; --warn-bg: #3a2f12; --warn-ink: #f5dfa6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #8f8d86; --grid: #2c2c2a; --axis: #3d3d3a;
    --border: rgba(255, 255, 255, 0.09);
    --brand: #3a37a0; --brand-text: #b3b0ff; --brand-ink: #ffffff; --brand-soft: #23223f;
    --accent: #3987e5; --good-text: #0ca30c; --bad-text: #e66767; --warn-bg: #3a2f12; --warn-ink: #f5dfa6;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 16px 56px; }
  button, select, input { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }

  /* header */
  .eyebrow { color: var(--brand-text); font-weight: 650; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
  h1 { font-size: 32px; line-height: 1.15; margin: 6px 0 4px; font-weight: 700; letter-spacing: -0.015em; }
  .sub { color: var(--ink-2); font-size: 14px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; margin-left: 6px; vertical-align: 1px; }

  /* toolbar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 22px 0 6px; }
  .toolbar select { min-width: 200px; }
  select, .btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover, select:hover { border-color: var(--axis); }
  .btn.ghost { background: transparent; }
  .toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .copied { font-size: 12px; color: var(--good-text); }
  .more { display: none; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 8px; }
  .more.open { display: flex; }
  .more label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
  .more label.chk { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; padding-bottom: 8px; }

  /* tabs */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--grid); margin: 18px 0 24px; overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand-text); font-weight: 600; }
  .tab .n { color: var(--muted); font-size: 12px; margin-left: 5px; font-variant-numeric: tabular-nums; font-weight: 400; }

  /* blocks */
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .tile .label { color: var(--ink-2); font-size: 13px; }
  .tile .value { font-size: 30px; font-weight: 700; margin-top: 6px; line-height: 1.1; letter-spacing: -0.01em; }
  .tile .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .tile.dark { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .tile.dark .label, .tile.dark .note { color: rgba(255, 255, 255, 0.78); }
  .good { color: var(--good-text); } .bad { color: var(--bad-text); }
  .tile.dark .good, .tile.dark .bad { color: #fff; font-weight: 600; }
  .section { margin-top: 36px; }
  .section h2 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); margin: 0 0 12px; }
  .two { display: grid; gap: 36px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }

  /* quarter strip */
  .quarters { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .q { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .q .qh { background: var(--brand-soft); padding: 8px 14px; font-weight: 650; font-size: 13px; }
  .q .qb { padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 13px; color: var(--ink-2); align-items: baseline; }
  .q .qb b { color: var(--ink); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
  .q .qb .big { font-size: 22px; }

  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }


  /* tables */
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { font-size: 12px; color: var(--ink-2); font-weight: 600; white-space: nowrap; background: var(--surface-2); border-bottom: 0; }
  th:first-child { border-radius: 8px 0 0 8px; } th:last-child { border-radius: 0 8px 8px 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  th button { all: unset; cursor: pointer; }
  th button:focus-visible { outline: 2px solid var(--accent); }
  th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 9px; }
  th[aria-sort="descending"] button::after { content: " ▼"; font-size: 9px; }
  .acct { font-weight: 600; color: var(--ink); }
  a.acct { text-decoration: none; }
  a.acct:hover { text-decoration: underline; color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; background: var(--brand-soft); color: var(--brand-text); margin-left: 6px; vertical-align: 1px; }
  .risk-amt { color: var(--bad-text); font-weight: 600; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
  .table-scroll { overflow-x: auto; }
  .table-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .table-tools input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; width: 260px; max-width: 100%; }
  .count { color: var(--muted); font-size: 13px; }


  .notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 20px; }
  footer details { width: 100%; }
  footer summary { cursor: pointer; }
  .checks { list-style: none; padding: 0; margin: 8px 0 0; }
  .checks li { padding: 3px 0; }

  .tip { position: absolute; pointer-events: none; z-index: 10; display: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,.14); border-radius: 8px; padding: 8px 10px; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tip b { display: block; margin-bottom: 2px; }
  .tip .row { display: flex; gap: 14px; justify-content: space-between; }
  .tip .k { color: var(--ink-2); }
  .noscript { background: #fff4d6; color: #3d2e00; border: 1px solid #e8c56a; border-radius: 10px; padding: 12px 16px; margin: 16px 0; }

  @media (max-width: 600px) {
    h1 { font-size: 26px; }
    .toolbar select { min-width: 0; flex: 1 1 140px; }
    .toolbar .right { margin-left: 0; }
  }
  @media print {
    body { background: #fff; }
    .toolbar, .more, .table-tools input, .tabs, footer details { display: none !important; }
    .tile, .q { break-inside: avoid; }
  }
</style>
</head>

<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("risk-data").textContent);
  var META = DATA.meta || {};
  var RULES = Object.assign({ consumptionThreshold: 0.5, blankConsumptionIsZero: true, minBaselineForRollup: 100000 }, META.rules || {});

  // ---------- slides: one per risk category ----------
  // "exclusive" walks the list in order and stops at the first match, so every
  // account lands on exactly one slide. "overlap" mirrors the workbook's sheets.
  function cons(r) { return r.consumption == null ? (RULES.blankConsumptionIsZero ? 0 : null) : r.consumption; }
  function lowCons(r) { var c = cons(r); return c != null && c < RULES.consumptionThreshold; }
  function hm(r) { return r.risk === "High" || r.risk === "Medium"; }
  var NAMED = { "Product & Technical Risk": 1, "Value Realization Risk": 1, "Competitive Risk": 1 };
  var thr = Math.round(RULES.consumptionThreshold * 100) + "%";
  var CATS = [
    { id: "consumption", label: "Consumption", title: "Consumption risk accounts",
      desc: "Accounts using less than " + thr + " of what they bought" + (RULES.blankConsumptionIsZero ? " (blank counts as 0%)" : ""),
      test: lowCons, overlap: lowCons },
    { id: "technical", label: "Technical", title: "Technical risk accounts", desc: "Risk reason is Product & Technical Risk",
      test: function (r) { return r.riskReason === "Product & Technical Risk"; } },
    { id: "value", label: "Value realisation", title: "Value realisation risk accounts", desc: "Risk reason is Value Realization Risk",
      test: function (r) { return r.riskReason === "Value Realization Risk"; } },
    { id: "competitive", label: "Competitive", title: "Competitive risk accounts", desc: "Risk reason is Competitive Risk. Each should be flagged with Sales",
      test: function (r) { return r.riskReason === "Competitive Risk"; } },
    { id: "other", label: "Other risk", title: "Other risk accounts", desc: "Any other account rated High or Medium risk, or with risk $ recorded",
      test: function (r) { return hm(r) || r.riskAmt > 0; },
      overlap: function (r) { return !NAMED[r.riskReason] && hm(r); } },
    { id: "healthy", label: "Healthy", title: "Healthy accounts", desc: "Renewing accounts with no risk flagged",
      test: function () { return true; },
      overlap: function (r) { return r.risk === "Low" && !lowCons(r) && r.riskReason !== "Product & Technical Risk" && r.riskReason !== "Competitive Risk"; } }
  ];
  var CAT = {};
  CATS.forEach(function (c, i) { c.rank = i; c.overlap = c.overlap || c.test; CAT[c.id] = c; });
  function category(r) { for (var i = 0; i < CATS.length; i++) if (CATS[i].test(r)) return CATS[i].id; return "healthy"; }
  var RISK_LEVEL = { High: ["var(--critical)", "✖"], Medium: ["var(--serious)", "▲"], Low: ["var(--good)", "●"] };

  // ---------- indexes ----------
  var snaps = DATA.snapshots.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; });
  var snapIdx = {};
  snaps.forEach(function (s, i) { snapIdx[s.id] = i; });
  var bySnap = {};
  DATA.rows.forEach(function (r) { (bySnap[r.snapshot] = bySnap[r.snapshot] || []).push(r); r._cat = category(r); });
  function uniq(list) { return list.filter(function (v, i, a) { return v != null && a.indexOf(v) === i; }).sort(); }
  var ENTITIES = uniq(DATA.rows.map(function (r) { return r.entity; }));
  var REGIONS = uniq(DATA.rows.map(function (r) { return r.region; }));
  var ENTITY_OF = {};
  DATA.rows.forEach(function (r) { if (r.region && r.entity) ENTITY_OF[r.region] = r.entity; });

  // ---------- formatting ----------
  var cur = META.currency || "USD", mC, mF;
  try {
    mC = new Intl.NumberFormat(undefined, { style: "currency", currency: cur, notation: "compact", maximumSignificantDigits: 3 });
    mF = new Intl.NumberFormat(undefined, { style: "currency", currency: cur, maximumFractionDigits: 0 });
  } catch (e) { mC = mF = { format: function (v) { return Math.round(v).toLocaleString(); } }; }
  var nF = new Intl.NumberFormat();
  var money = function (v) { return mC.format(v || 0); };
  var moneyFull = function (v) { return mF.format(v || 0); };
  var int = function (v) { return nF.format(Math.round(v || 0)); };
  var pct = function (v, d) { return v == null || isNaN(v) ? "—" : (v * 100).toFixed(d || 0) + "%"; };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var el = function (id) { return document.getElementById(id); };
  el("fMinLabel").textContent = "Baseline ≥ " + money(RULES.minBaselineForRollup) + " only";

  // ---------- state, mirrored into the URL hash so a view can be shared ----------
  var DEFAULTS = { view: "overview", scope: "all", snap: snaps[snaps.length - 1].id, quarter: "all", type: "all", owner: "all", esp: false, min: false, mode: "exclusive" };
  var FILTER_KEYS = ["quarter", "type", "owner", "esp", "min", "mode"];
  var state = Object.assign({}, DEFAULTS);
  var BOOL = { esp: 1, min: 1 };
  function readHash() {
    try {
      var p = new URLSearchParams(location.hash.replace(/^#/, ""));
      Object.keys(state).forEach(function (k) { var v = p.get(k); if (v != null) state[k] = BOOL[k] ? v === "1" : v; });
      if (snapIdx[state.snap] == null) state.snap = DEFAULTS.snap;
      if (state.view !== "overview" && !CAT[state.view]) state.view = "overview";
    } catch (e) { /* sandboxed: keep defaults */ }
  }
  function hashString() { return Object.keys(state).map(function (k) { return k + "=" + encodeURIComponent(BOOL[k] ? (state[k] ? "1" : "0") : state[k]); }).join("&"); }
  function writeHash() { try { history.replaceState(null, "", "#" + hashString()); } catch (e) { /* ignore */ } }

  // scope is "all", "entity:<name>" or "region:<name>"
  function scopeParts() { var i = state.scope.indexOf(":"); return i < 0 ? ["all", ""] : [state.scope.slice(0, i), state.scope.slice(i + 1)]; }
  function inScope(r) {
    var sp = scopeParts();
    if (sp[0] !== "all" && r[sp[0]] !== sp[1]) return false;
    if (state.quarter !== "all" && r.quarter !== state.quarter) return false;
    if (state.type !== "all" && r.type !== state.type) return false;
    if (state.owner !== "all" && (r.owner || "(no owner)") !== state.owner) return false;
    if (state.esp && !r.esp) return false;
    if (state.min && r.baseline < RULES.minBaselineForRollup) return false;
    return true;
  }
  function rowsFor(id) { return (bySnap[id] || []).filter(inScope); }
  function scopeName() { var sp = scopeParts(); return sp[0] === "all" ? "All regions" : sp[1]; }
  function members(rows, c) { return rows.filter(function (r) { return state.mode === "exclusive" ? r._cat === c.id : c.overlap(r); }); }
  function sum(rows, k) { return rows.reduce(function (t, r) { return t + (r[k] || 0); }, 0); }
  function riskRows(rows) { return rows.filter(function (r) { return r._cat !== "healthy"; }); }
  function weekOnly(sn) { return sn ? String(sn.label || sn.id).split(" · ")[0] : ""; }

  // ---------- links out to Gainsight / Salesforce ----------
  // Templates come from META.links, e.g. ".../customersuccess360?cid={gsid}"; {field} is a row field.
  // A "Gainsight URL" column in the dump wins over the template.
  var LINKS = META.links || {};
  function fillLink(tpl, r) {
    if (!tpl) return null;
    var ok = true;
    var url = tpl.replace(/\{(\w+)\}/g, function (_, k) { if (r[k] == null || r[k] === "") ok = false; return encodeURIComponent(r[k] == null ? "" : r[k]); });
    return ok ? url : null;
  }
  function gainsightUrl(r) { return r.gainsightUrl || fillLink(LINKS.gainsight, r); }
  function accountCell(r, showRegion, isNew) {
    var gs = gainsightUrl(r), sf = fillLink(LINKS.salesforce, r);
    var name = gs ? '<a class="acct" href="' + esc(gs) + '" target="_blank" rel="noopener" title="Open in Gainsight">' + esc(r.account) + " ↗</a>" : '<span class="acct">' + esc(r.account) + "</span>";
    var sub = [showRegion ? esc(r.region) : "", sf ? '<a href="' + esc(sf) + '" target="_blank" rel="noopener">Salesforce ↗</a>' : ""].filter(Boolean).join(" · ");
    return name + (isNew ? '<span class="tag">New</span>' : "") + (sub ? '<br><span class="count">' + sub + "</span>" : "");
  }
  // Inside SharePoint's sandbox the page's own address is "about:srcdoc", which can't be shared.
  var SANDBOXED = (function () { try { return /^about:/.test(location.href); } catch (e) { return true; } })();

  // ---------- toolbar ----------
  function option(v, t, cur) { var o = document.createElement("option"); o.value = v; o.textContent = t; o.selected = v === cur; return o; }
  function fill(select, options, value) {
    select.innerHTML = "";
    options.forEach(function (o) {
      if (o.group) {
        var g = document.createElement("optgroup"); g.label = o.group;
        o.items.forEach(function (it) { g.appendChild(option(it[0], it[1], value)); });
        select.appendChild(g);
      } else select.appendChild(option(o[0], o[1], value));
    });
    if (select.value !== value) select.selectedIndex = 0;
    return select.value;
  }
  function fillToolbar() {
    var scopes = [["all", "All regions"]];
    if (ENTITIES.length) ENTITIES.forEach(function (e) {
      scopes.push({ group: e, items: [["entity:" + e, "All " + e]].concat(REGIONS.filter(function (g) { return ENTITY_OF[g] === e; }).map(function (g) { return ["region:" + g, g]; })) });
    });
    else REGIONS.forEach(function (g) { scopes.push(["region:" + g, g]); });
    state.scope = fill(el("fScope"), scopes, state.scope);
    state.snap = fill(el("fSnap"), snaps.slice().reverse().map(function (s, i) { return [s.id, (s.label || s.id) + (i === 0 ? " (latest)" : "")]; }), state.snap);
    var snapRows = bySnap[state.snap] || [], sp = scopeParts();
    state.quarter = fill(el("fQuarter"), [["all", "All quarters"]].concat(uniq(snapRows.map(function (r) { return r.quarter; })).map(function (q) { return [q, q]; })), state.quarter);
    state.type = fill(el("fType"), [["all", "SaaS and Software"], ["SaaS", "SaaS"], ["Software", "Software"]], state.type);
    var owners = uniq(snapRows.filter(function (r) { return sp[0] === "all" || r[sp[0]] === sp[1]; }).map(function (r) { return r.owner || "(no owner)"; }));
    state.owner = fill(el("fOwner"), [["all", "All owners"]].concat(owners.map(function (o) { return [o, o]; })), state.owner);
    el("fEsp").checked = state.esp; el("fMin").checked = state.min; el("fMode").value = state.mode;
    var n = FILTER_KEYS.filter(function (k) { return state[k] !== DEFAULTS[k]; }).length;
    el("btnMore").textContent = n ? "More filters (" + n + " on)" : "More filters";
  }
  [["fScope", "scope"], ["fSnap", "snap"], ["fQuarter", "quarter"], ["fType", "type"], ["fOwner", "owner"], ["fMode", "mode"]].forEach(function (p) {
    el(p[0]).addEventListener("change", function () { state[p[1]] = el(p[0]).value; if (p[1] === "scope") state.owner = "all"; update(); });
  });
  el("fEsp").addEventListener("change", function () { state.esp = el("fEsp").checked; update(); });
  el("fMin").addEventListener("change", function () { state.min = el("fMin").checked; update(); });
  el("btnMore").addEventListener("click", function () { el("btnMore").setAttribute("aria-expanded", el("more").classList.toggle("open")); });
  el("btnReset").addEventListener("click", function () { FILTER_KEYS.forEach(function (k) { state[k] = DEFAULTS[k]; }); update(); });
  el("btnPrint").addEventListener("click", function () { window.print(); });
  if (SANDBOXED) el("btnLink").style.display = "none";
  el("btnLink").addEventListener("click", function () {
    var url; try { url = location.href.split("#")[0] + "#" + hashString(); } catch (e) { url = "#" + hashString(); }
    function done(m) { el("copied").textContent = m; setTimeout(function () { el("copied").textContent = ""; }, 2500); }
    try { navigator.clipboard.writeText(url).then(function () { done("Link copied"); }, function () { window.prompt("Copy this link:", url); }); }
    catch (e) { window.prompt("Copy this link:", url); }
  });
  el("tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-view]"); if (b) { state.view = b.getAttribute("data-view"); showAll = false; update(); } });

  // ---------- tooltip + bars ----------
  var tip = el("tip");
  function showTip(title, pairs, evt) {
    tip.innerHTML = "<b>" + esc(title) + "</b>" + pairs.map(function (p) { return '<div class="row"><span class="k">' + esc(p[0]) + "</span><span>" + esc(p[1]) + "</span></div>"; }).join("");
    tip.style.display = "block";
    var w = tip.offsetWidth, h = tip.offsetHeight, x = evt.pageX + 14, y = evt.pageY - h - 14;
    if (x > window.scrollX + document.documentElement.clientWidth - w - 8) x = evt.pageX - w - 14;
    if (y < window.scrollY + 8) y = evt.pageY + 14;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.style.display = "none"; }
  var NS = "http://www.w3.org/2000/svg";
  function s(tag, attrs, parent) { var n = document.createElementNS(NS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
  function text(parent, x, y, str, attrs) { var t = s("text", Object.assign({ x: x, y: y, fill: "var(--ink-2)", "font-size": 12 }, attrs || {}), parent); t.textContent = str; return t; }
  function hbar(x, y, w, h) {
    var r = Math.min(4, w / 2, h / 2);
    return "M" + x + "," + y + "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + h - r) + "Q" + (x + w) + "," + (y + h) + " " + (x + w - r) + "," + (y + h) + "H" + x + "Z";
  }
  // Single-series horizontal bars. items: [{label, value, valueLabel, tip: [[k, v]], onClick}]
  function bars(host, items, aria) {
    host.innerHTML = "";
    if (!items.length) { host.innerHTML = '<div class="empty">Nothing to show for this selection</div>'; return; }
    var W = Math.max(280, host.clientWidth || 480), rowH = 40, bar = 20, lw = Math.min(140, W * 0.32), vw = 150, iw = W - lw - vw, H = items.length * rowH;
    var max = Math.max.apply(null, items.map(function (d) { return d.value; })) || 1;
    var svg = s("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": aria }, host);
    s("line", { x1: lw, x2: lw, y1: 0, y2: H, stroke: "var(--axis)" }, svg);
    items.forEach(function (d, i) {
      var y0 = i * rowH + (rowH - bar) / 2, w = Math.max(2, (d.value / max) * iw);
      var lbl = text(svg, lw - 10, y0 + bar / 2 + 4, d.label, { "text-anchor": "end" });
      var p = s("path", { d: hbar(lw, y0, w, bar), fill: "var(--accent)" }, svg);
      text(svg, lw + w + 8, y0 + bar / 2 + 4, d.valueLabel, { fill: "var(--ink)" });
      var hit = s("rect", { x: 0, y: i * rowH, width: W, height: rowH, fill: "transparent", style: d.onClick ? "cursor:pointer" : "" }, svg);
      hit.addEventListener("mousemove", function (e) { p.setAttribute("opacity", "0.85"); showTip(d.label, d.tip, e); });
      hit.addEventListener("mouseleave", function () { p.removeAttribute("opacity"); hideTip(); });
      if (d.onClick) { lbl.setAttribute("text-decoration", "underline"); hit.addEventListener("click", function () { hideTip(); d.onClick(); }); }
    });
  }
  function badge(map, key) {
    var b = map[key];
    return b ? '<span class="badge"><span aria-hidden="true" style="color:' + b[0] + '">' + b[1] + "</span>" + esc(key) + "</span>" : '<span style="color:var(--muted)">—</span>';
  }
  function delta(now, before, f, upIsGood, prevLabel) {
    var d = now - before;
    if (Math.abs(d) < 1e-6 || f(Math.abs(d)) === f(0)) return "No change vs " + esc(prevLabel);
    var good = upIsGood ? d > 0 : d < 0;
    return '<span class="' + (good ? "good" : "bad") + '">' + (d > 0 ? "▲ +" : "▼ −") + f(Math.abs(d)) + "</span> vs " + esc(prevLabel);
  }
  function tile(label, value, note, dark) {
    return '<div class="tile' + (dark ? " dark" : "") + '"><div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + "</div>" + (note ? '<div class="note">' + note + "</div>" : "") + "</div>";
  }

  // ---------- overview ----------
  function renderOverview(rows, prev, prevSnap) {
    var risky = riskRows(rows), totalRisk = sum(rows, "riskAmt"), base = sum(rows, "baseline"), pl = weekOnly(prevSnap);
    var top3 = rows.filter(function (r) { return r.riskAmt > 0; }).sort(function (a, b) { return b.riskAmt - a.riskAmt; }).slice(0, 3);
    var top3Risk = sum(top3, "riskAmt");
    var html = '<div class="tiles">' +
      tile("Total revenue at risk", money(totalRisk), pct(base ? totalRisk / base : 0, 1) + " of " + money(base) + " renewing" + (prevSnap ? "<br>" + delta(totalRisk, sum(prev, "riskAmt"), money, false, pl) : ""), true) +
      tile("Accounts at risk", int(risky.length), "of " + int(rows.length) + " renewing" + (prevSnap ? "<br>" + delta(risky.length, riskRows(prev).length, int, false, pl) : "")) +
      tile("Top 3 accounts' risk", money(top3Risk), "") +
      tile("Top 3 share of total risk", pct(totalRisk ? top3Risk / totalRisk : 0, 1), "") +
      "</div>";

    var qs = uniq(rows.map(function (r) { return r.quarter; }));
    html += '<div class="section"><h2>Revenue at risk over baseline</h2><div class="quarters">' + qs.map(function (q) {
      var qr = rows.filter(function (r) { return r.quarter === q; }), qrisk = sum(qr, "riskAmt"), qbase = sum(qr, "baseline");
      return '<div class="q"><div class="qh">' + esc(q) + '</div><div class="qb">' +
        '<span>Risk $</span><b class="big">' + money(qrisk) + "</b>" +
        "<span>Risk %</span><b>" + pct(qbase ? qrisk / qbase : 0, 1) + "</b>" +
        "<span>Risk accounts</span><b>" + int(riskRows(qr).length) + "</b>" +
        "<span>Baseline</span><b>" + money(qbase) + "</b></div></div>";
    }).join("") + "</div></div>";

    var sp = scopeParts(), showRegions = sp[0] !== "region" && REGIONS.length > 1;
    var level = sp[0] === "all" && ENTITIES.length > 1 ? "entity" : "region";
    html += '<div class="section two"><div><h2>Revenue at risk by risk driver</h2><div class="chart" id="drivers"></div></div>' +
      (showRegions ? "<div><h2>Revenue at risk by " + (level === "entity" ? "sales entity" : "sales region") + '</h2><div class="chart" id="regions"></div></div>' : "") + "</div>";

    html += '<div class="section"><h2>Top 3 accounts at risk</h2><div class="table-scroll"><table><thead><tr><th>Account</th><th>Quarter</th><th class="num">Baseline</th><th class="num">Risk $</th><th>Risk reason</th><th>Risk</th><th>Owner</th></tr></thead><tbody>' +
      (top3.length ? top3.map(function (r) {
        return "<tr><td>" + accountCell(r, true) + '</td><td class="nowrap">' + esc(r.quarter) + '</td><td class="num">' + moneyFull(r.baseline) + '</td><td class="num risk-amt">' + moneyFull(r.riskAmt) +
          "</td><td>" + esc(r.riskReason || "—") + "</td><td>" + badge(RISK_LEVEL, r.risk) + '</td><td class="nowrap">' + esc(r.owner || "—") + "</td></tr>";
      }).join("") : '<tr><td colspan="7" class="empty">No risk $ in this selection</td></tr>') + "</tbody></table></div></div>";

    el("view").innerHTML = html;

    bars(el("drivers"), CATS.filter(function (c) { return c.id !== "healthy"; }).map(function (c) {
      var m = members(rows, c), r = sum(m, "riskAmt");
      return { label: c.label, value: r, valueLabel: money(r) + " · " + int(m.length) + (m.length === 1 ? " acct" : " accts"),
        tip: [["Risk $", moneyFull(r)], ["Share of risk $", pct(totalRisk ? r / totalRisk : 0, 1)], ["Accounts", int(m.length)], ["", "Click to open the slide"]],
        onClick: function () { state.view = c.id; update(); window.scrollTo(0, 0); } };
    }).filter(function (d) { return d.value > 0; }).sort(function (a, b) { return b.value - a.value; }), "Revenue at risk by risk driver");

    if (showRegions) {
      var groups = {};
      rows.forEach(function (r) { var k = r[level] || "(blank)"; var g = groups[k] = groups[k] || { k: k, risk: 0, n: 0 }; g.risk += r.riskAmt; if (r._cat !== "healthy") g.n++; });
      bars(el("regions"), Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (a, b) { return b.risk - a.risk; }).map(function (g) {
        return { label: g.k, value: g.risk, valueLabel: money(g.risk), tip: [["Risk $", moneyFull(g.risk)], ["Accounts at risk", int(g.n)], ["", "Click to open"]],
          onClick: function () { state.scope = level + ":" + g.k; state.owner = "all"; update(); } };
      }), "Revenue at risk by " + level);
    }
  }
  // ---------- category slide ----------
  var sort = { k: "riskAmt", dir: -1 }, showAll = false, TOP_N = 15, slideRows = [];
  var COLS = [
    { k: "account", l: "Account" }, { k: "espTxt", l: "ESP" }, { k: "type", l: "Type" }, { k: "quarter", l: "Quarter" },
    { k: "baseline", l: "Baseline (ARR)", num: 1 }, { k: "riskAmt", l: "Risk $", num: 1 }, { k: "riskSubReason", l: "Risk sub-reason" },
    { k: "consumption", l: "Util %", num: 1 }, { k: "riskRank", l: "Risk", num: 1 }, { k: "owner", l: "Owner" }
  ];
  function renderCategory(rows, prev, prevSnap) {
    var c = CAT[state.view], list = members(rows, c), prevList = members(prev, c), prevIds = {};
    prevList.forEach(function (r) { prevIds[r.accountId || r.account] = 1; });
    var withCons = list.filter(function (r) { return r.consumption != null; });
    var html = "";
    if (state.mode === "overlap") {
      var times = rows.map(function (r) { return CATS.filter(function (x) { return x.overlap(r); }).length; });
      html += '<div class="notice">Using the current workbook rules: ' + int(times.filter(function (t) { return t > 1; }).length) + " accounts are on more than one slide and " +
        int(times.filter(function (t) { return t === 0; }).length) + " are on none.</div>";
    }
    html += '<div class="tiles">' +
      tile(c.label + " accounts", int(list.length), prevSnap ? delta(list.length, prevList.length, int, false, weekOnly(prevSnap)) : "") +
      tile("Baseline of accounts", money(sum(list, "baseline")), "") +
      tile("Average consumption", withCons.length ? pct(sum(withCons, "consumption") / withCons.length, 1) : "—", "") +
      tile("High-risk accounts", int(list.filter(function (r) { return r.risk === "High"; }).length), "") +
      tile(c.label + " risk $", money(sum(list, "riskAmt")), prevSnap ? delta(sum(list, "riskAmt"), sum(prevList, "riskAmt"), money, false, weekOnly(prevSnap)) : "", true) + "</div>";
    html += '<div class="section"><div class="table-tools"><span class="count" id="slideCount"></span>' +
      '<input type="search" id="slideSearch" placeholder="Search accounts, owners, reasons" aria-label="Search accounts"></div>' +
      '<div class="table-scroll"><table id="slideTable"></table></div></div>';
    el("view").innerHTML = html;

    slideRows = list.map(function (r) {
      return Object.assign({}, r, {
        espTxt: r.esp ? "Y" : "N", riskRank: ({ High: 3, Medium: 2, Low: 1 })[r.risk] || 0,
        isNew: !!prevSnap && !prevIds[r.accountId || r.account]
      });
    });
    el("slideSearch").addEventListener("input", renderSlideTable);
    el("slideTable").addEventListener("click", onTableClick);
    renderSlideTable();
  }
  function renderSlideTable() {
    var q = (el("slideSearch").value || "").trim().toLowerCase();
    var list = slideRows.filter(function (r) {
      return !q || [r.account, r.owner, r.riskReason, r.riskSubReason, r.region].join(" ").toLowerCase().indexOf(q) >= 0;
    });
    list.sort(function (a, b) {
      var x = a[sort.k], y = b[sort.k];
      if (x == null || x === "") return 1; if (y == null || y === "") return -1;
      return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sort.dir;
    });
    var total = list.length, showRegion = scopeParts()[0] !== "region";
    if (!showAll && !q) list = list.slice(0, TOP_N);
    var head = "<thead><tr>" + COLS.map(function (c) {
      return '<th class="' + (c.num && c.k !== "riskRank" ? "num" : "") + '" aria-sort="' + (sort.k === c.k ? (sort.dir > 0 ? "ascending" : "descending") : "none") + '"><button type="button" data-k="' + c.k + '">' + esc(c.l) + "</button></th>";
    }).join("") + "</tr></thead>";
    var body = list.map(function (r) {
      return "<tr><td>" + accountCell(r, showRegion, r.isNew) + "</td>" +
        "<td>" + r.espTxt + "</td><td>" + esc(r.type) + '</td><td class="nowrap">' + esc(r.quarter) + '</td><td class="num">' + moneyFull(r.baseline) +
        '</td><td class="num risk-amt">' + (r.riskAmt ? moneyFull(r.riskAmt) : "—") + "</td><td>" + esc(r.riskSubReason || "—") +
        '</td><td class="num">' + pct(r.consumption, 1) + "</td><td>" + badge(RISK_LEVEL, r.risk) + '</td><td class="nowrap">' + esc(r.owner || "—") + "</td></tr>";
    }).join("");
    if (!total) body = '<tr><td colspan="' + COLS.length + '" class="empty">No accounts on this slide</td></tr>';
    if (total > list.length) body += '<tr><td colspan="' + COLS.length + '" style="text-align:center;border:0;padding-top:14px"><button type="button" class="btn" id="showAll">Show all ' + int(total) + " accounts</button></td></tr>";
    else if (showAll && total > TOP_N) body += '<tr><td colspan="' + COLS.length + '" style="text-align:center;border:0;padding-top:14px"><button type="button" class="btn" id="showAll">Show top ' + TOP_N + " only</button></td></tr>";
    el("slideTable").innerHTML = head + "<tbody>" + body + "</tbody>";
    el("slideCount").textContent = (total > list.length ? "Top " + list.length + " of " + int(total) : int(total)) + " accounts by " +
      COLS.filter(function (c) { return c.k === sort.k; })[0].l.toLowerCase() + (LINKS.gainsight ? ". Click an account to open it in Gainsight." : ".");
  }
  function onTableClick(e) {
    if (e.target.id === "showAll") { showAll = !showAll; renderSlideTable(); return; }
    var b = e.target.closest("button[data-k]");
    if (b) {
      var k = b.getAttribute("data-k"), num = (COLS.filter(function (c) { return c.k === k; })[0] || {}).num;
      sort = sort.k === k ? { k: k, dir: -sort.dir } : { k: k, dir: num ? -1 : 1 };
      renderSlideTable();
    }
  }

  // ---------- footer: data checks ----------
  function renderChecks(rows) {
    var checks = [
      ["Risk $ recorded but no risk reason", rows.filter(function (r) { return r.riskAmt > 0 && !r.riskReason; })],
      ["Consumption % is blank", rows.filter(function (r) { return r.consumption == null; })],
      ["No risk level (High / Medium / Low)", rows.filter(function (r) { return !r.risk; })],
      ["No CS owner", rows.filter(function (r) { return !r.owner; })]
    ];
    var bad = checks.filter(function (c) { return c[1].length; }).length;
    el("checksSummary").textContent = bad ? "Data checks: " + bad + " issue" + (bad > 1 ? "s" : "") + " in this selection" : "Data checks: all clear";
    el("checks").innerHTML = checks.map(function (c) {
      return "<li>" + (c[1].length ? "▲ " + int(c[1].length) + " · " : "✓ ") + esc(c[0]) +
        (c[1].length ? " (" + esc(c[1].slice(0, 3).map(function (r) { return r.account; }).join(", ")) + (c[1].length > 3 ? "…" : "") + ")" : "") + "</li>";
    }).join("") + (DATA.warnings ? Object.keys(DATA.warnings).map(function (k) { return DATA.warnings[k].map(function (w) { return "<li>Note (" + esc(k) + "): " + esc(w) + "</li>"; }).join(""); }).join("") : "");
  }

  // ---------- main ----------
  function render() {
    var sn = snaps[snapIdx[state.snap]], prevSnap = snaps[snapIdx[state.snap] - 1];
    var rows = rowsFor(state.snap), prev = prevSnap ? rowsFor(prevSnap.id) : [];
    var sp = scopeParts();
    el("eyebrow").textContent = "Area risk review · " + scopeName() + " · " + (sn.week || sn.label || sn.id);
    el("title").textContent = state.view === "overview" ? (sp[0] === "region" ? "Region overview" : sp[0] === "entity" ? sp[1] + " overview" : "Overview") : CAT[state.view].title;
    el("subtitle").textContent = (state.view === "overview" ? "Revenue renewing in the next three quarters, and how much of it is at risk" : CAT[state.view].desc) + " · As of " + (sn.date || sn.id);
    el("flags").innerHTML = META.note ? '<span class="pill">Sample data</span>' : "";
    el("tabs").innerHTML = '<button type="button" role="tab" class="tab" data-view="overview" aria-selected="' + (state.view === "overview") + '">Overview</button>' +
      CATS.map(function (c) {
        return '<button type="button" role="tab" class="tab" data-view="' + c.id + '" aria-selected="' + (state.view === c.id) + '">' + esc(c.label) + '<span class="n">' + int(members(rows, c).length) + "</span></button>";
      }).join("");
    if (state.view === "overview") renderOverview(rows, prev, prevSnap);
    else renderCategory(rows, prev, prevSnap);
    renderChecks(rows);
  }
  function update() { fillToolbar(); writeHash(); render(); }

  document.title = META.title || "Area Risk Review";
  el("footSource").textContent = "Sources: " + (META.sources || []).join(" → ");
  el("footGen").textContent = META.generatedAt ? "Built " + META.generatedAt : "";
  readHash();
  update();
  window.addEventListener("hashchange", function () { readHash(); update(); });
  var lastW = document.documentElement.clientWidth, timer;
  window.addEventListener("resize", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { var w = document.documentElement.clientWidth; if (w !== lastW) { lastW = w; render(); } }, 150);
  });
})();
</script>
</body>
